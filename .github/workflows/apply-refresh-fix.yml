name: apply-refresh-fix
on:
  workflow_dispatch:
  push:
    paths:
      - tools/apply-refresh-fix.py
      - .github/workflows/apply-refresh-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: python3 tools/apply-refresh-fix.py
      - name: Commit patched routes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/routes-aura26.js
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Remove territory totals; live WR/lead in move list; bind ply via kE"
            git push
          fi
