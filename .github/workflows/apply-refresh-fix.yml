name: apply-refresh-fix
on:
  workflow_dispatch:
  push:
    paths:
      - tools/apply-refresh-fix.py
      - tools/test-board-click.mjs
      - tools/wr-graph-fns.js
      - tools/wr-graph-pt.js
      - tools/wr-graph-live.js
      - .github/workflows/apply-refresh-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: python3 tools/apply-refresh-fix.py
      - name: Test graph / click / goMain / sub-board
        run: node tools/test-board-click.mjs
      - name: Commit patched assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/routes-aura26.js assets/routes-aura30.js assets/index-aura30.js assets/styles-aura26.css assets/styles-aura30.css index.html tools/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Drop wr-key legend; Wails fight-index wr/lead damp; cache-bust aura30"
            git push
          fi
